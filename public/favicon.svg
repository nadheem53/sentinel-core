<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Plate -->
  <rect width="64" height="64" rx="16" fill="#080a0f" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1f293d" stroke-width="2" />
  <!-- Shield Outer -->
  <path d="M32 10L48 18V32C48 42.5 41 50.5 32 54C23 50.5 16 42.5 16 32V18L32 10Z" stroke="url(#cyber-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Shield Core Pulse -->
  <circle cx="32" cy="32" r="6" fill="#00f3ff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <!-- Tech Crosshairs -->
  <line x1="32" y1="20" x2="32" y2="24" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="40" x2="32" y2="44" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="32" x2="24" y2="32" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="32" x2="44" y2="32" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
</svg>